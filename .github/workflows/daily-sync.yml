name: Morning sync and publish
on:
  schedule:
    - cron: "*/5 0-11 * * *"
      timezone: America/New_York
    - cron: "0 12 * * *"
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync-and-publish
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'scr171931-lgtm/soju'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
      - name: Mirror upstream and check out the mirrored commit
        run: |
          git fetch --no-tags https://github.com/tp898508/soju.git refs/heads/main
          git push origin +FETCH_HEAD:refs/heads/upstream-main
          git checkout --detach FETCH_HEAD
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
